<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YZ96VCVFWN"></script>
  <script>
    window.dataLayer = window.dataLayer || [];

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post an Ad - BusinessMen Marketplace</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="bm logo.png" type="image/png">
  <link rel="stylesheet" href="css/style.css?v=11">
  <script defer src="js/nav.js?v=7"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
  <div id="nav-container"></div>

  <main class="post-ad-page">
    <h1>Post an Ad</h1>
    <p>Your ad will appear on the marketplace. No account needed.</p>

    <div id="postForm" class="post-ad-form">
      <div class="form-group">
        <label for="title">Product / Service Title *</label>
        <input type="text" id="title" maxlength="100" placeholder="e.g. 3-Bedroom Flat for Rent in Ikeja" required>
        <div class="char-count"><span id="titleCount">0</span>/100</div>
      </div>

      <div class="form-group">
        <label for="category">Category *</label>
        <select id="category" required>
          <option value="">Select category</option>
          <option>Real Estate</option>
          <option>Electronics</option>
          <option>Vehicles</option>
          <option>Furniture</option>
          <option>Fashion</option>
          <option>Jobs</option>
          <option>Services</option>
          <option>Agriculture</option>
          <option>Food & Drinks</option>
          <option>Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="price">Price (₦) *</label>
        <input type="text" id="price" placeholder="e.g. 500,000" required>
      </div>

      <div class="form-group">
        <label for="description">Description *</label>
        <textarea id="description" maxlength="1000" placeholder="Describe your product or service..." required></textarea>
        <div class="char-count"><span id="descCount">0</span>/1000</div>
      </div>

      <div class="form-group">
        <label>Photo (optional)</label>
        <div class="file-upload" id="fileUpload" onclick="document.getElementById('photoInput').click()">
          <input type="file" id="photoInput" accept="image/*">
          <div class="file-upload-label" id="uploadLabel">
            Click to upload a photo <strong>+</strong>
          </div>
          <img class="image-preview" id="imagePreview">
        </div>
      </div>

      <div class="form-group">
        <label for="phone">Phone Number *</label>
        <input type="tel" id="phone" placeholder="e.g. 0803 123 4567" required>
      </div>

      <div class="form-group">
        <label for="whatsapp">WhatsApp Number (optional)</label>
        <input type="tel" id="whatsapp" placeholder="e.g. 0803 123 4567">
      </div>

      <div class="form-group">
        <label for="state">State *</label>
        <select id="state" required>
          <option value="">Select state</option>
          <option>Abia</option>
          <option>Adamawa</option>
          <option>Akwa Ibom</option>
          <option>Anambra</option>
          <option>Bauchi</option>
          <option>Bayelsa</option>
          <option>Benue</option>
          <option>Borno</option>
          <option>Cross River</option>
          <option>Delta</option>
          <option>Ebonyi</option>
          <option>Edo</option>
          <option>Ekiti</option>
          <option>Enugu</option>
          <option>FCT Abuja</option>
          <option>Gombe</option>
          <option>Imo</option>
          <option>Jigawa</option>
          <option>Kaduna</option>
          <option>Kano</option>
          <option>Katsina</option>
          <option>Kebbi</option>
          <option>Kogi</option>
          <option>Kwara</option>
          <option>Lagos</option>
          <option>Nasarawa</option>
          <option>Niger</option>
          <option>Ogun</option>
          <option>Ondo</option>
          <option>Osun</option>
          <option>Oyo</option>
          <option>Plateau</option>
          <option>Rivers</option>
          <option>Sokoto</option>
          <option>Taraba</option>
          <option>Yobe</option>
          <option>Zamfara</option>
        </select>
      </div>

      <div class="form-group">
        <label for="address">Address (optional)</label>
        <input type="text" id="address" placeholder="e.g. 15 Awolowo Road, Ikoyi">
      </div>

      <div class="form-group">
        <div class="cf-turnstile" data-sitekey="0x4AAAAAADSQX4TZupvwvbTC"></div>
      </div>

      <button class="btn-primary" id="submitBtn" onclick="submitAd()">Post Ad</button>
    </div>

    <div class="success-message" id="successMessage" style="display:none">
      <h2>Ad Posted Successfully!</h2>
      <p>Your ad is now live on the marketplace. It will remain visible until the listing limit is reached.</p>
      <a href="marketplace.html" class="btn-primary">View Marketplace</a>
      <a href="post-ad.html" style="display:inline-block;margin-top:12px;color:#e94560;font-weight:500">Post another ad</a>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script>
    const IMGBB_KEY = '80f6be9e7166c0e3acc2d285154cd7c4';

    document.getElementById('title').addEventListener('input', function() {
      document.getElementById('titleCount').textContent = this.value.length;
    });
    document.getElementById('description').addEventListener('input', function() {
      document.getElementById('descCount').textContent = this.value.length;
    });

    document.getElementById('photoInput').addEventListener('change', function(e) {
      var file = e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(ev) {
        var preview = document.getElementById('imagePreview');
        preview.src = ev.target.result;
        preview.style.display = 'block';
        document.getElementById('uploadLabel').textContent = 'Tap to change photo';
      };
      reader.readAsDataURL(file);
    });

    function uploadToImgbb(file) {
      return new Promise(function(resolve, reject) {
        var formData = new FormData();
        formData.append('image', file);
        formData.append('key', IMGBB_KEY);
        var xhr = new XMLHttpRequest();
        xhr.open('POST', 'https://api.imgbb.com/1/upload');
        xhr.onload = function() {
          if (xhr.status === 200) {
            try {
              var resp = JSON.parse(xhr.responseText);
              resolve(resp.data.url);
            } catch(e) { reject(e); }
          } else { reject(xhr.statusText); }
        };
        xhr.onerror = function() { reject('Network error'); };
        xhr.send(formData);
      });
    }

    function containsLink(text) {
      var urlPattern = /https?:\/\/|www\.|\.com\b|\.org\b|\.net\b|\.ng\b|\.co\b|\.io\b|\.biz\b|\.info\b|bit\.ly|tinyurl|t\.co|goo\.gl|wa\.me|t\.me|t\.me\/|telegram\.org|facebook\.com|instagram\.com|twitter\.com|x\.com|linkedin\.com|youtube\.com|tiktok\.com|whatsapp\.com/gi;
      return urlPattern.test(text);
    }

    function submitAd() {
      if (typeof turnstile !== 'undefined' && turnstile.getResponse().length === 0) {
        alert('Please complete the verification.');
        return;
      }

      var title = document.getElementById('title').value.trim();
      var category = document.getElementById('category').value;
      var price = document.getElementById('price').value.trim();
      var desc = document.getElementById('description').value.trim();
      var phone = document.getElementById('phone').value.trim();
      var whatsapp = document.getElementById('whatsapp').value.trim();
      var state = document.getElementById('state').value;
      var address = document.getElementById('address').value.trim();
      var photoFile = document.getElementById('photoInput').files[0];
      var btn = document.getElementById('submitBtn');

      if (!title || !category || !price || !desc || !phone || !state) {
        alert('Please fill in all required fields.');
        return;
      }

      if (containsLink(title) || containsLink(desc) || containsLink(phone) || containsLink(whatsapp)) {
        alert('Links and URLs are not allowed in ads.');
        btn.textContent = 'Post Ad';
        btn.disabled = false;
        return;
      }

      btn.textContent = 'Posting...';
      btn.disabled = true;

      var uploadPromise = photoFile ? uploadToImgbb(photoFile) : Promise.resolve(null);

      uploadPromise.then(function(imageUrl) {
        return db.collection('marketplace').orderBy('createdAt', 'asc').get().then(function(snapshot) {
          var count = snapshot.size;
          if (count >= 200) {
            var oldest = snapshot.docs[0];
            return oldest.ref.delete().then(function() {
              return db.collection('marketplace').add({
                title: title,
                category: category,
                price: price,
                description: desc,
                phone: phone,
                whatsapp: whatsapp || null,
                state: state,
                address: address || null,
                imageUrl: imageUrl,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
              });
            });
          }
          return db.collection('marketplace').add({
            title: title,
            category: category,
            price: price,
            description: desc,
            phone: phone,
            whatsapp: whatsapp || null,
            state: state,
            address: address || null,
            imageUrl: imageUrl,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        });
      }).then(function() {
        if (typeof turnstile !== 'undefined') turnstile.reset();
        document.getElementById('postForm').style.display = 'none';
        document.getElementById('successMessage').style.display = 'block';
      }).catch(function(err) {
        alert('Error posting ad: ' + (typeof err === 'string' ? err : err.message));
        btn.textContent = 'Post Ad';
        btn.disabled = false;
      });
    }
  </script>
</body>
</html>
