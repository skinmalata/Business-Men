    var imgIdx = {};
    function getImgUrl(cat, title) {
      var s = title.toLowerCase().replace(/\s+/g, '').replace(/[^a-z0-9]/g, '');
      var pool = {
        'Electronics': 'https://picsum.photos/seed/' + s + '/400/300',
        'Vehicles': 'https://picsum.photos/seed/' + s + '/400/300',
        'Real Estate': 'https://picsum.photos/seed/' + s + '/400/300',
        'Furniture': 'https://picsum.photos/seed/' + s + '/400/300',
        'Fashion': 'https://picsum.photos/seed/' + s + '/400/300',
        'Jobs': 'https://picsum.photos/seed/office' + s + '/400/300',
        'Services': 'https://picsum.photos/seed/tools' + s + '/400/300',
        'Agriculture': 'https://picsum.photos/seed/farm' + s + '/400/300',
        'Food & Drinks': 'https://picsum.photos/seed/food' + s + '/400/300',
        'Other': 'https://picsum.photos/seed/item' + s + '/400/300',
      };
      return pool[cat] || 'https://picsum.photos/seed/' + s + '/400/300';
    }

    var status = document.getElementById('status');
    var count = 0;
    var errors = [];

    function uploadNext(i) {
      if (i >= ads.length) {
        var msg = 'Seeded ' + count + ' of ' + ads.length + ' listings successfully!';
        if (errors.length) msg += '<br><br><span class="error">' + errors.length + ' errors</span>';
        status.innerHTML = '<span class="done">' + msg + '</span><br><br><a href="marketplace.html" style="display:inline-block;background:#e94560;color:white;padding:12px 24px;border-radius:8px;text-decoration:none;font-weight:600">View Marketplace</a>';
        return;
      }

      var ad = ads[i];
      status.textContent = 'Seeding ' + (i + 1) + ' of ' + ads.length + ': ' + ad.title + '...';

      db.collection('marketplace').add({
        title: ad.title,
        category: ad.category,
        price: ad.price,
        description: ad.description,
        phone: ad.phone,
        imageUrl: getImgUrl(ad.category, ad.title),
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        expiresAt: new Date(Date.now() + 72 * 60 * 60 * 1000)
      }).then(function() {
        count++;
        setTimeout(function() { uploadNext(i + 1); }, 300);
      }).catch(function(err) {
        errors.push(ad.title + ': ' + err.message);
        setTimeout(function() { uploadNext(i + 1); }, 300);
      });
    }

    uploadNext(0);
