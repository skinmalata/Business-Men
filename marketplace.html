<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketplace - BusinessMen Nigeria</title>
  <meta name="description" content="Browse buy and sell listings in Nigeria. Post free ads for products, services, jobs, real estate and more. No account needed.">
  <link rel="canonical" href="https://businessmen.com.ng/marketplace.html">
  <link rel="icon" href="bm logo.png" type="image/png">
  <link rel="stylesheet" href="css/style.css?v=9">
  <script defer src="js/nav.js?v=5"></script>
</head>
<body>
  <div id="nav-container"></div>

  <section class="marketplace-hero">
    <div class="container">
      <h1>Marketplace</h1>
      <p style="margin-bottom:20px">Buy, sell, and trade — free ads, no account needed.</p>
      <div class="marketplace-hero-search" role="search">
        <label for="marketplaceCat" class="sr-only">Select category</label>
        <select id="marketplaceCat" aria-label="Select category">
          <option value="all">All Categories</option>
          <option>Real Estate</option>
          <option>Electronics</option>
          <option>Vehicles</option>
          <option>Furniture</option>
          <option>Fashion</option>
          <option>Jobs</option>
          <option>Services</option>
          <option>Agriculture</option>
          <option>Food & Drinks</option>
          <option>Other</option>
        </select>
        <label for="marketplaceQuery" class="sr-only">Search marketplace</label>
        <input type="text" id="marketplaceQuery" placeholder="Search products, services, jobs..." aria-label="Search marketplace" onkeydown="if(event.key==='Enter')heroMarketplaceSearch()">
        <button onclick="heroMarketplaceSearch()" aria-label="Search">Search</button>
      </div>
      <div style="margin-top:16px">
        <a href="post-ad.html" class="btn-primary">+ Post a Free Ad</a>
      </div>
    </div>
  </section>

  <main class="container" style="padding-top:28px">
    <div class="marketplace-filter-bar">
      <input type="text" id="searchInput" placeholder="Search listings..." oninput="filterAds()">
      <select id="categoryFilter" onchange="filterAds()">
        <option value="all">All Categories</option>
        <option>Real Estate</option>
        <option>Electronics</option>
        <option>Vehicles</option>
        <option>Furniture</option>
        <option>Fashion</option>
        <option>Jobs</option>
        <option>Services</option>
        <option>Agriculture</option>
        <option>Food & Drinks</option>
        <option>Other</option>
      </select>
      <span style="color:#94a3b8;font-size:0.85rem" id="resultCount"></span>
    </div>

    <div class="marketplace-caution">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      <span><strong>Safety Tip:</strong> Never send money before seeing the product in person. Meet in a safe public place and verify the item before paying.</span>
    </div>

    <div class="marketplace-grid" id="adGrid"></div>
    <div id="mpPagination" class="pagination"></div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script>
    var allAds = [];
    var mpCurrentPage = 1;
    var MP_ITEMS_PER_PAGE = 20;

    function formatPrice(price) {
      var p = price.replace(/,/g, '').trim();
      if (/^\d+$/.test(p)) {
        return '₦' + Number(p).toLocaleString();
      }
      return price;
    }

    function timeAgo(date) {
      var diff = Date.now() - date;
      var mins = Math.floor(diff / 60000);
      if (mins < 60) return mins + 'm ago';
      var hours = Math.floor(mins / 60);
      if (hours < 24) return hours + 'h ago';
      var days = Math.floor(hours / 24);
      return days + 'd ago';
    }

    function escapeHtml(text) {
      var div = document.createElement('div');
      div.appendChild(document.createTextNode(text));
      return div.innerHTML;
    }

    function renderAds(ads) {
      var grid = document.getElementById('adGrid');
      var totalPages = Math.max(1, Math.ceil(ads.length / MP_ITEMS_PER_PAGE));
      if (mpCurrentPage > totalPages) mpCurrentPage = totalPages;

      var start = (mpCurrentPage - 1) * MP_ITEMS_PER_PAGE;
      var pageItems = ads.slice(start, start + MP_ITEMS_PER_PAGE);

      document.getElementById('resultCount').textContent = ads.length + ' listing' + (ads.length !== 1 ? 's' : '');
      if (ads.length === 0) {
        grid.innerHTML = '<div class="empty-marketplace"><h3>No listings found</h3><p>Try a different search or <a href="post-ad.html" style="color:#e94560;font-weight:600">post an ad</a>.</p></div>';
        document.getElementById('mpPagination').innerHTML = '';
        return;
      }
      grid.innerHTML = pageItems.map(function(ad) {
        var imgHtml = ad.imageUrl
          ? '<img class="marketplace-card-img" src="' + ad.imageUrl + '" alt="' + ad.title + '" loading="lazy">'
          : '<div class="marketplace-card-img-placeholder">No photo</div>';
        var created = ad.createdAt ? timeAgo(ad.createdAt.toMillis()) : '';
        return (
          '<a href="ad-detail.html?id=' + ad.id + '" class="marketplace-card">' +
            imgHtml +
            '<div class="marketplace-card-body">' +
              '<div class="marketplace-card-price">' + formatPrice(ad.price) + '</div>' +
              '<h3>' + escapeHtml(ad.title) + '</h3>' +
              '<div class="marketplace-card-desc">' + escapeHtml(ad.description) + '</div>' +
              '<div class="marketplace-card-meta">' +
                '<span>' + ad.category + '</span>' +
                '<span>' + created + '</span>' +
              '</div>' +
            '</div>' +
          '</a>'
        );
      }).join('');

      renderMpPagination(ads.length, totalPages);
    }

    function renderMpPagination(total, totalPages) {
      var container = document.getElementById('mpPagination');
      if (total <= MP_ITEMS_PER_PAGE) {
        container.innerHTML = '';
        return;
      }

      var html = '';
      html += '<button onclick="goToMpPage(' + (mpCurrentPage - 1) + ')" ' + (mpCurrentPage <= 1 ? 'disabled' : '') + '>&larr; Prev</button>';

      var startPage = Math.max(1, mpCurrentPage - 2);
      var endPage = Math.min(totalPages, mpCurrentPage + 2);

      if (startPage > 1) {
        html += '<button onclick="goToMpPage(1)">1</button>';
        if (startPage > 2) html += '<span class="page-info">...</span>';
      }

      for (var i = startPage; i <= endPage; i++) {
        html += '<button onclick="goToMpPage(' + i + ')" class="' + (i === mpCurrentPage ? 'active' : '') + '">' + i + '</button>';
      }

      if (endPage < totalPages) {
        if (endPage < totalPages - 1) html += '<span class="page-info">...</span>';
        html += '<button onclick="goToMpPage(' + totalPages + ')">' + totalPages + '</button>';
      }

      html += '<button onclick="goToMpPage(' + (mpCurrentPage + 1) + ')" ' + (mpCurrentPage >= totalPages ? 'disabled' : '') + '>Next &rarr;</button>';

      container.innerHTML = html;
    }

    function goToMpPage(page) {
      var ads = getFilteredAds();
      var totalPages = Math.max(1, Math.ceil(ads.length / MP_ITEMS_PER_PAGE));
      if (page < 1 || page > totalPages) return;
      mpCurrentPage = page;
      renderAds(ads);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function getFilteredAds() {
      var search = document.getElementById('searchInput').value.toLowerCase().trim();
      var cat = document.getElementById('categoryFilter').value;

      return allAds.filter(function(ad) {
        if (cat !== 'all' && ad.category !== cat) return false;
        if (search) {
          var title = (ad.title || '').toLowerCase();
          var desc = (ad.description || '').toLowerCase();
          var state = (ad.state || '').toLowerCase();
          var address = (ad.address || '').toLowerCase();
          var phone = (ad.phone || '').toLowerCase();
          var searchable = title + ' ' + desc + ' ' + state + ' ' + address + ' ' + phone;
          var terms = search.split(/\s+/);
          for (var i = 0; i < terms.length; i++) {
            if (searchable.indexOf(terms[i]) === -1) return false;
          }
        }
        return true;
      });
    }

    function filterAds() {
      mpCurrentPage = 1;
      renderAds(getFilteredAds());
    }

    function heroMarketplaceSearch() {
      var q = document.getElementById('marketplaceQuery').value.trim();
      var cat = document.getElementById('marketplaceCat').value;
      document.getElementById('searchInput').value = q;
      document.getElementById('categoryFilter').value = cat;
      mpCurrentPage = 1;
      document.getElementById('searchInput').scrollIntoView({ behavior: 'smooth', block: 'start' });
      document.getElementById('searchInput').focus();
      filterAds();
    }

    window.goToMpPage = goToMpPage;
    window.heroMarketplaceSearch = heroMarketplaceSearch;

    db.collection('marketplace')
      .orderBy('createdAt', 'desc')
      .onSnapshot(function(snapshot) {
        allAds = [];
        snapshot.forEach(function(doc) {
          var ad = doc.data();
          ad.id = doc.id;
          allAds.push(ad);
        });
        allAds.sort(function(a, b) {
          var ta = a.createdAt ? a.createdAt.toMillis() : 0;
          var tb = b.createdAt ? b.createdAt.toMillis() : 0;
          return tb - ta;
        });
        filterAds();
      }, function(err) {
        document.getElementById('adGrid').innerHTML = '<div class="empty-marketplace"><h3>Could not load listings</h3><p>' + (err.message || err) + '</p></div>';
      });
  </script>
</body>
</html>
