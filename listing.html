<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="dynamicTitle">Business Directory - BusinessMen Nigeria</title>
  <meta name="description" id="dynamicDesc" content="Find verified businesses in Nigeria with direct contact information. Browse hotels, hospitals, schools, and agriculture companies across all Nigerian cities.">
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large">
  <link rel="canonical" href="https://skinmalata.github.io/Business-Men/listing.html">
  <link rel="alternate" hreflang="en" href="https://skinmalata.github.io/Business-Men/listing.html">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏢</text></svg>">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" id="ogUrl" content="https://skinmalata.github.io/Business-Men/listing.html">
  <meta property="og:title" id="ogTitle" content="Business Directory - BusinessMen Nigeria">
  <meta property="og:description" id="ogDesc" content="Find verified businesses in Nigeria with direct contact information.">
  <meta property="og:site_name" content="BusinessMen">
  <meta property="og:locale" content="en_NG">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" id="twTitle" content="Business Directory - BusinessMen Nigeria">
  <meta name="twitter:description" id="twDesc" content="Find verified businesses in Nigeria with direct contact information.">

  <!-- JSON-LD: BreadcrumbList (updated by JS per listing) -->
  <script type="application/ld+json" id="breadcrumbSchema">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      {"@type": "ListItem", "position": 1, "name": "BusinessMen", "item": "https://skinmalata.github.io/Business-Men/"},
      {"@type": "ListItem", "position": 2, "name": "Business Directory", "item": "https://skinmalata.github.io/Business-Men/listing.html"}
    ]
  }
  </script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <nav class="navbar" aria-label="Main navigation">
      <div class="container">
        <a href="/Business-Men/" class="logo">Business<span>Men</span></a>
        <div class="nav-links">
          <a href="/Business-Men/">Home</a>
          <a href="/Business-Men/listing.html?cat=hotels">Hotels</a>
          <a href="/Business-Men/listing.html?cat=hospitals">Hospitals</a>
          <a href="/Business-Men/listing.html?cat=schools">Schools</a>
          <a href="/Business-Men/listing.html?cat=agriculture">Agriculture</a>
          <a href="/Business-Men/listing.html?cat=transportation">Transport</a>
          <a href="/Business-Men/listing.html?cat=shopping">Shopping</a>
          <a href="/Business-Men/listing.html?cat=business">Business</a>
          <a href="/Business-Men/listing.html?cat=realestate">Real Estate</a>
          <a href="/Business-Men/claim.html" class="nav-cta">Get Listed</a>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <div class="container">
      <!-- Listing grid view (when no id param) -->
      <div id="listView">
        <div class="hero-search" role="search" style="margin: 24px 0;">
          <label for="heroCity" class="sr-only">Select city</label>
          <select id="heroCity" aria-label="Select city">
            <option value="">All Cities</option>
          </select>
          <label for="heroQuery" class="sr-only">Search businesses</label>
          <input type="text" id="heroQuery" placeholder="Search by name or keyword..." aria-label="Search businesses">
          <button onclick="heroSearch()" aria-label="Search">Search</button>
        </div>
        <aside class="filter-bar" aria-label="Filter options">
          <label for="cityFilter" class="sr-only">Filter by city</label>
          <select id="cityFilter" onchange="applyFilters()" aria-label="Filter by city">
            <option value="">All Cities</option>
          </select>
        </aside>
        <div id="listingGrid" class="listing-grid" role="list" aria-label="Business listings"></div>
      </div>
      <!-- Single listing detail view (when id param present) -->
      <div id="listingDetail" class="listing-detail" itemscope itemtype="https://schema.org/LocalBusiness" style="display:none;"></div>
      <div id="loading" class="loading" role="status" aria-live="polite">Loading...</div>
      <div id="noResults" class="no-results" style="display:none" role="status">No listings found matching your search.</div>
    </div>
  </main>

  <footer class="footer" role="contentinfo">
    <div class="container">
      <p><strong>BusinessMen</strong> &mdash; Nigeria Business Directory. <a href="/Business-Men/claim.html">Claim your business</a> to update your listing.</p>
    </div>
  </footer>

  <script defer src="js/app.js"></script>
  <script defer>
    function populateHeroCities() {
      const select = document.getElementById('heroCity');
      if (!select || typeof allData === 'undefined' || !allData.length) { setTimeout(populateHeroCities, 200); return; }
      const cities = [...new Set(allData.map(d => d.city).filter(Boolean))].sort();
      cities.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        select.appendChild(opt);
      });
    }
    function heroSearch() {
      const query = document.getElementById('heroQuery').value.trim();
      const city = document.getElementById('heroCity').value;
      const params = new URLSearchParams(window.location.search);
      if (query) params.set('q', query);
      else params.delete('q');
      if (city) params.set('city', city);
      else params.delete('city');
      window.location.href = 'listing.html?' + params.toString();
    }
    document.addEventListener('DOMContentLoaded', () => {
      loadListingDetail();
      setTimeout(populateHeroCities, 500);
    });
    window.populateHeroCities = populateHeroCities;
    window.heroSearch = heroSearch;
  </script>
</body>
</html>
